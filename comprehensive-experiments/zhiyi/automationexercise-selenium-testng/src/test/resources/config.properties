# 所有可变参数写在配置文件或命令行里，避免写死在测试代码中。
baseUrl=https://automationexercise.com
browser=chrome
headless=false
timeoutSeconds=18

# 注册/登录数据。email 会在运行时动态生成，避免重复注册。
username=Selenium Student
password=Test@123456
emailDomain=example.com

# 性能测试参数：线程数必须大于 100，可按电脑/网络情况调整。
performance.threads=120
performance.requestsPerThread=2
